<!-- ============================================================================
 片段：clip-path 图片揭示 clip-reveal
 用途：图片入视口时，裁切框从 inset(8%) 展开到 inset(0)，内部图片同时
       从 scale(1.04) 收敛到 1——双重收敛的「显影」感。杂志/编辑气质。
 来源：landing-cielo-v5-magazine/index.html（.reveal-img）

 关键参数（以源码为准）：
   裁切             clip-path: inset(8%) → inset(0)
   内部缩放         img scale(1.04) → scale(1)
   时长 / 缓动      1s / cubic-bezier(0.16, 1, 0.3, 1)（easeOutExpo）
   触发             IntersectionObserver threshold 0.2，触发即 unobserve（一次性）
   图宽             width: min(560px, 100%)，margin:0 auto（杂志栏宽）
   hero 特例        首屏 hero 图不走 IO，page-load 编排最后一拍 setTimeout 650ms 揭示
   附带细节         hover 时 img opacity 0.92（transition 0.4s ease）

 ?shot=1 完成态规则（硬约定）：
   - html.shot .reveal-img { clip-path:inset(0); transition:none; }
   - html.shot .reveal-img img { transform:scale(1); transition:none; }
   - JS 里检测到 shot 直接 return，不注册任何 IO / timeout

 已知坑：
   - clip-path 和 transform 分属容器与 img 两层，两条 transition 必须同参数
     （1s 同一缓动），否则边框先到、内容后到，显影感破功。
   - hero 图若也用 IO，首屏即触发会和标题入场动画撞车；源文件的处理是
     unobserve(heroFig) + 650ms 定时，作为 page-load 编排的收尾一拍。
   - 非首屏的图记得给 <img> 加 loading="lazy"（源文件三张内文图都加了）。
   - IO 触发后立刻 unobserve：揭示是一次性的，滚走再回来不重播。
============================================================================ -->

<style>
.reveal-img{
  width:min(560px, 100%);
  margin:0 auto;
  overflow:hidden;
  clip-path:inset(8%);
  transition:clip-path 1s cubic-bezier(0.16,1,0.3,1);
}
.reveal-img img{
  display:block;width:100%;height:auto;
  transform:scale(1.04);
  transition:transform 1s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
}
.reveal-img.revealed{clip-path:inset(0);}
.reveal-img.revealed img{transform:scale(1);}
.reveal-img:hover img{opacity:0.92;}
/* ?shot=1 完成态 */
html.shot .reveal-img{clip-path:inset(0);transition:none;}
html.shot .reveal-img img{transform:scale(1);transition:none;}
</style>

<!-- 结构：hero 图加 .hero-figure 走定时揭示；内文图直接 .reveal-img 走 IO -->
<figure class="reveal-img hero-figure">
  <img src="你的图.jpg" alt="……">
</figure>

<script>
(function () {
  var isShot = /[?&]shot=1\b/.test(location.search);
  if (isShot) {
    document.documentElement.classList.add('shot');
    return;                                   // shot 模式：不注册任何监听
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('revealed');
      io.unobserve(entry.target);             // 一次性
    });
  }, { threshold: 0.2 });
  document.querySelectorAll('.reveal-img').forEach(function (el) {
    io.observe(el);
  });
  // hero 图：page load 编排的最后一拍，650ms 后揭示
  var heroFig = document.querySelector('.hero-figure');
  if (heroFig) {
    io.unobserve(heroFig);
    setTimeout(function () { heroFig.classList.add('revealed'); }, 650);
  }
})();
</script>
