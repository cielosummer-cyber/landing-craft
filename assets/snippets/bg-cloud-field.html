<!-- ============================================================================
 片段：紫夜云层/山峦迁移背景 bg-cloud-field
 用途：Raw WebGL 全屏背景。5 层 fbm 山峦剪影向不同速度漂移（视差），
       山脊带辉光，天空有闪烁星野 + 偶发流星，地平线泛紫色光晕。
       夜空/深紫基调，适合 SaaS、AI、平台型产品的 hero 底。
 来源：threeui（MIT，github.com/MengTo/threeui）
       src/shaders/neuform-isolated/sources/strata-cloud.html
       已剥掉原页全部导航/hero/GSAP/卡片内容，只留 WebGL 渲染层。

 关键参数（片段顶部 CONFIG，按需微调）：
   SKY_TOP     天顶色   [0.015,0.012,0.045]（rgb 0-1）
   SKY_BOTTOM  地平线色 [0.065,0.045,0.14]
               天中色由两者 50% 混合自动得出
   ACCENT      强调紫   [0.20,0.10,0.35]
               山脊辉光 / 地平线光晕 / 薄雾共用；5 层山体剪影色
               由 ACCENT × [0.70,0.55,0.40,0.25,0.15] 派生（远亮近暗）
   STAR        星光色   [0.9,0.8,1.0]，流星同色
   SHOT_T      155.67   shot 定格秒数：GPU 实测此时有一颗流星飞到
               画面中上方满亮度处（seed=23, cycle≈0.35）。
               注意必须用 GPU 实测选点——CPU 端 Math.sin 算的 hash
               和 GPU sin() 在大参数下精度不同，CPU 预测会落空。

 ?shot=1 确定性终态规则（landing-atelier 硬约定）：
   - URL 带 shot=1 时：u_time 固定 SHOT_T、鼠标固定画面中心 (0.5,0.5)，
     渲染一帧后停手，不进 rAF。着色器无随机输入，截图像素级一致。
   - 正常模式从 0 计时、鼠标视差生效。

 已知坑：
   - 流星是周期事件（mod(t*0.15,1)），70% 的周期里根本没有流星
     （hash(seed)>0.30 直接 return 0）；shot 时间点必须挑有流星的
     周期。换 SHOT_T 别信 CPU 端预算的 hash——GLSL sin() 大参数
     精度和 JS Math.sin 不一致，要用 readPixels/截图在 GPU 上实测。
   - 山体只在画面下 ~40%，上半屏靠星野和渐变撑着，文字排版别全堆
     在上半屏，视觉重心会空。原页 hero 文字居中偏下是有原因的。
   - getContext 开了 preserveDrawingBuffer:true（原页遗留，对截图
     友好）；性能可关，但关了某些 headless 截图会拿到空缓冲。
   - 鼠标视差有 0.04 的惯性平滑，shot 模式直接置 0.5 不走平滑。
   - WebGL 不可用时静默跳过，页面只剩纯色底。
============================================================================ -->

<canvas id="bg-cloud-field" aria-hidden="true"
        style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;"></canvas>

<script>
(function () {
  // ── CONFIG：色板集中在这里 ─────────────────────────────
  var SKY_TOP    = [0.015, 0.012, 0.045];  // 天顶色（0-1）
  var SKY_BOTTOM = [0.065, 0.045, 0.14];   // 地平线色
  var ACCENT     = [0.20,  0.10,  0.35];   // 强调紫：辉光/光晕/山体基色
  var STAR       = [0.9,   0.8,   1.0];    // 星光/流星色
  var SHOT_T     = 155.67;                 // shot 定格秒数（有流星，GPU 实测）
  // ───────────────────────────────────────────────────────

  var SHOT = location.search.indexOf('shot=1') > -1;

  var canvas = document.getElementById('bg-cloud-field');
  var gl = canvas.getContext('webgl', { antialias: true, alpha: false, preserveDrawingBuffer: true });
  if (!gl) return; // 无 WebGL：静默留纯色底

  function f(n) { return n.toFixed(4); }
  function v3(c) { return 'vec3(' + f(c[0]) + ',' + f(c[1]) + ',' + f(c[2]) + ')'; }
  function scaled(c, k) { return v3([c[0] * k, c[1] * k, c[2] * k]); }
  var SKY_MID = [(SKY_TOP[0]+SKY_BOTTOM[0])/2, (SKY_TOP[1]+SKY_BOTTOM[1])/2, (SKY_TOP[2]+SKY_BOTTOM[2])/2];
  // 5 层山体：远亮近暗
  var LAYER_SCALE = [0.70, 0.55, 0.40, 0.25, 0.15];

  var VS = [
    'attribute vec2 a_pos;',
    'void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  var FS = [
    'precision highp float;',
    'uniform vec2 u_res;',
    'uniform float u_time;',
    'uniform vec2 u_mouse;',
    '',
    'float hash(float n){ return fract(sin(n)*43758.5453123); }',
    'float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }',
    '',
    'float noise(float x){',
    '  float i = floor(x);',
    '  float f = fract(x);',
    '  f = f*f*(3.0-2.0*f);',
    '  return mix(hash(i), hash(i+1.0), f);',
    '}',
    '',
    'float fbm(float x, float octaves){',
    '  float val = 0.0;',
    '  float amp = 0.5;',
    '  float freq = 1.0;',
    '  for(int i = 0; i < 6; i++){',
    '    if(float(i) >= octaves) break;',
    '    val += amp * noise(x * freq);',
    '    freq *= 2.17;',
    '    amp *= 0.48;',
    '  }',
    '  return val;',
    '}',
    '',
    'float meteor(vec2 uv, float t){',
    '  float cycle = mod(t * 0.15, 1.0);',
    '  float seed = floor(t * 0.15);',
    '  float h = hash(seed * 7.31);',
    '  float h2 = hash(seed * 13.17);',
    '  if(h > 0.30) return 0.0;',
    '  vec2 start = vec2(0.2 + h2 * 0.6, 0.7 + h * 0.25);',
    '  vec2 dir = normalize(vec2(1.0, -0.6 - h * 0.3));',
    '  float progress = smoothstep(0.0, 0.7, cycle);',
    '  vec2 pos = start + dir * progress * 0.5;',
    '  vec2 toP = uv - pos;',
    '  float along = dot(toP, dir);',
    '  float perp = length(toP - dir * along);',
    '  float trail = smoothstep(0.0, -0.12, along) * smoothstep(-0.18, -0.04, along);',
    '  float core = smoothstep(0.003, 0.0, perp) * trail;',
    '  float glow = smoothstep(0.012, 0.0, perp) * trail * 0.3;',
    '  float fade = smoothstep(0.0, 0.1, cycle) * smoothstep(0.8, 0.55, cycle);',
    '  return (core + glow) * fade;',
    '}',
    '',
    'float stars(vec2 uv, float density){',
    '  vec2 cell = floor(uv * density);',
    '  vec2 sub = fract(uv * density);',
    '  float h = hash2(cell);',
    '  float brightness = step(0.975, h);',
    '  float size = 0.025 + h * 0.045;',
    '  float d = length(sub - vec2(hash2(cell + 100.0), hash2(cell + 200.0)));',
    '  float star = brightness * smoothstep(size, 0.0, d);',
    '  star *= 0.5 + 0.5 * sin(u_time * (1.0 + h * 3.0) + h * 6.28);',
    '  return star;',
    '}',
    '',
    'void main(){',
    '  vec2 uv = gl_FragCoord.xy / u_res;',
    '  float aspect = u_res.x / u_res.y;',
    '',
    '  vec2 mouse = u_mouse * 2.0 - 1.0;',
    '',
    '  vec3 skyTop    = ' + v3(SKY_TOP) + ';',
    '  vec3 skyMid    = ' + v3(SKY_MID) + ';',
    '  vec3 skyBottom = ' + v3(SKY_BOTTOM) + ';',
    '  vec3 accent    = ' + v3(ACCENT) + ';',
    '',
    '  float skyGrad = uv.y;',
    '  vec3 col = mix(skyBottom, skyMid, smoothstep(0.3, 0.6, skyGrad));',
    '  col = mix(col, skyTop, smoothstep(0.6, 1.0, skyGrad));',
    '',
    '  float horizonY = 0.35;',
    '  float horizonGlow = exp(-pow((uv.y - horizonY) * 3.8, 2.0));',
    '  col += accent * 0.75 * horizonGlow * 0.8;',
    '',
    '  float centerGlow = exp(-pow((uv.x - 0.5) * 1.5, 2.0)) * exp(-pow((uv.y - horizonY) * 4.0, 2.0));',
    '  col += accent * 0.7 * centerGlow * 0.6;',
    '',
    '  float starField = stars(uv * vec2(aspect, 1.0), 60.0)',
    '                  + stars(uv * vec2(aspect, 1.0) + 500.0, 100.0) * 0.7',
    '                  + stars(uv * vec2(aspect, 1.0) + 900.0, 160.0) * 0.4;',
    '',
    '  float starMask = 1.0;',
    '  float xC, yS, prof, mTop, mtn, rDist, rGlow, rAmb;',
    '  vec3 lC;',
    '',
    // 5 层山体：速度/尺度/视差逐层递增，颜色由 ACCENT 派生
    '  lC = ' + scaled(ACCENT, LAYER_SCALE[0]) + ';',
    '  xC = uv.x * aspect * 1.6 + u_time * 0.006 + mouse.x * 0.010;',
    '  yS = mouse.y * 0.003;',
    '  prof = fbm(xC, 5.0) * 0.10 + fbm(xC * 0.3 + 17.0, 3.0) * 0.07;',
    '  mTop = 0.40 + prof + yS;',
    '  mtn = smoothstep(mTop + 0.003, mTop - 0.001, uv.y);',
    '  rDist = abs(uv.y - mTop);',
    '  rGlow = smoothstep(0.012, 0.0, rDist) * 0.18;',
    '  rAmb = smoothstep(0.04, 0.0, rDist) * 0.06;',
    '  col = mix(col, lC, mtn);',
    '  col += accent * rGlow;',
    '  col += accent * 0.6 * rAmb;',
    '  starMask *= (1.0 - mtn);',
    '',
    '  lC = ' + scaled(ACCENT, LAYER_SCALE[1]) + ';',
    '  xC = uv.x * aspect * 2.0 + u_time * 0.012 + mouse.x * 0.020;',
    '  yS = mouse.y * 0.006;',
    '  prof = fbm(xC, 5.0) * 0.13 + fbm(xC * 0.3 + 34.0, 3.0) * 0.091;',
    '  mTop = 0.33 + prof + yS;',
    '  mtn = smoothstep(mTop + 0.003, mTop - 0.001, uv.y);',
    '  rDist = abs(uv.y - mTop);',
    '  rGlow = smoothstep(0.012, 0.0, rDist) * 0.15;',
    '  rAmb = smoothstep(0.04, 0.0, rDist) * 0.045;',
    '  col = mix(col, lC, mtn);',
    '  col += accent * rGlow;',
    '  col += accent * 0.6 * rAmb;',
    '  starMask *= (1.0 - mtn);',
    '',
    '  lC = ' + scaled(ACCENT, LAYER_SCALE[2]) + ';',
    '  xC = uv.x * aspect * 2.6 + u_time * 0.020 + mouse.x * 0.034;',
    '  yS = mouse.y * 0.010;',
    '  prof = fbm(xC, 5.0) * 0.16 + fbm(xC * 0.3 + 51.0, 3.0) * 0.112;',
    '  mTop = 0.26 + prof + yS;',
    '  mtn = smoothstep(mTop + 0.003, mTop - 0.001, uv.y);',
    '  rDist = abs(uv.y - mTop);',
    '  rGlow = smoothstep(0.012, 0.0, rDist) * 0.12;',
    '  rAmb = smoothstep(0.04, 0.0, rDist) * 0.03;',
    '  col = mix(col, lC, mtn);',
    '  col += accent * rGlow;',
    '  col += accent * 0.6 * rAmb;',
    '  starMask *= (1.0 - mtn);',
    '',
    '  lC = ' + scaled(ACCENT, LAYER_SCALE[3]) + ';',
    '  xC = uv.x * aspect * 3.2 + u_time * 0.030 + mouse.x * 0.050;',
    '  yS = mouse.y * 0.015;',
    '  prof = fbm(xC, 5.0) * 0.14 + fbm(xC * 0.3 + 68.0, 3.0) * 0.098;',
    '  mTop = 0.18 + prof + yS;',
    '  mtn = smoothstep(mTop + 0.003, mTop - 0.001, uv.y);',
    '  rDist = abs(uv.y - mTop);',
    '  rGlow = smoothstep(0.012, 0.0, rDist) * 0.09;',
    '  col = mix(col, lC, mtn);',
    '  col += accent * rGlow;',
    '  starMask *= (1.0 - mtn);',
    '',
    '  lC = ' + scaled(ACCENT, LAYER_SCALE[4]) + ';',
    '  xC = uv.x * aspect * 4.0 + u_time * 0.044 + mouse.x * 0.070;',
    '  yS = mouse.y * 0.021;',
    '  prof = fbm(xC, 5.0) * 0.11 + fbm(xC * 0.3 + 85.0, 3.0) * 0.077;',
    '  mTop = 0.09 + prof + yS;',
    '  mtn = smoothstep(mTop + 0.003, mTop - 0.001, uv.y);',
    '  rDist = abs(uv.y - mTop);',
    '  rGlow = smoothstep(0.012, 0.0, rDist) * 0.06;',
    '  col = mix(col, lC, mtn);',
    '  col += accent * rGlow;',
    '  starMask *= (1.0 - mtn);',
    '',
    '  col += ' + v3(STAR) + ' * starField * starMask;',
    '  float met = meteor(uv * vec2(aspect, 1.0), u_time);',
    '  col += ' + v3(STAR) + ' * met * starMask;',
    '',
    '  float vig = 1.0 - 0.3 * pow(length((uv - 0.5) * vec2(1.1, 1.6)), 2.0);',
    '  col *= vig;',
    '',
    '  float haze = exp(-pow((uv.y - 0.33) * 5.0, 2.0)) * 0.05;',
    '  col += accent * 0.75 * haze;',
    '',
    '  col = pow(col, vec3(0.95));',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function createShader(src, type) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
    return s;
  }

  var vs = createShader(VS, gl.VERTEX_SHADER);
  var fs = createShader(FS, gl.FRAGMENT_SHADER);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  var mx = 0.5, my = 0.5, smx = 0.5, smy = 0.5;
  document.addEventListener('mousemove', function (e) {
    mx = e.clientX / window.innerWidth;
    my = 1.0 - e.clientY / window.innerHeight;
  });

  function drawFrame(tSec, ux, uy) {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, tSec);
    gl.uniform2f(uMouse, ux, uy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  if (SHOT) {
    // 确定性终态：固定时间 + 鼠标居中，渲一帧即停
    drawFrame(SHOT_T, 0.5, 0.5);
    return;
  }

  var running = true, rafId = null;
  function frame(t) {
    if (!running) return;
    smx += (mx - smx) * 0.04;
    smy += (my - smy) * 0.04;
    drawFrame(t * 0.001, smx, smy);
    rafId = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else if (!running) {
      running = true;
      rafId = requestAnimationFrame(frame);
    }
  });
  rafId = requestAnimationFrame(frame);
})();
</script>
