<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>teal-solar-rings · 签名交互 demo</title>
<style>
  :root{
    --bg:#0f1b21; --ink:#ece5d3; --gold:#d9a441; --teal:#4ea08e;
    --spring:#7cb56a; --summer:#d4694e; --autumn:#dfa33e; --winter:#5e94c4;
    --muted:rgba(158,178,182,.85); --hair:rgba(236,229,211,.26);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Noto Sans SC","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{width:1200px;height:760px;position:relative;flex:none;transform-origin:center}
  /* 标题区 */
  #title{position:absolute;left:56px;top:48px;z-index:2}
  #title h1{
    font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:900;
    font-size:34px;letter-spacing:.04em;color:var(--gold);
  }
  #title .en{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:13px;opacity:.7;margin-top:6px}
  #title .sub{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--muted)}
  #title .sub::before,#title .sub::after{content:"";width:36px;height:1px;background:var(--hair)}
  /* chips */
  #chips{position:absolute;left:56px;bottom:42px;display:flex;gap:8px;z-index:2}
  .chip{
    font-size:11px;padding:5px 12px;border:1px solid var(--hair);border-radius:999px;
    color:var(--muted);cursor:pointer;background:transparent;letter-spacing:.1em;
  }
  .chip:hover{border-color:var(--gold)}
  .chip.on{color:var(--gold);border-color:var(--gold)}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  /* 操作说明 */
  #hint{position:absolute;left:56px;bottom:88px;font-size:10.5px;line-height:1.9;color:var(--muted);z-index:2;max-width:190px}
  #hint b{color:var(--ink);font-weight:400}
  /* 侧栏 */
  #side{
    position:absolute;right:56px;top:120px;width:320px;z-index:2;
    border-top:1px solid var(--hair);padding-top:18px;
  }
  #side .sec{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;color:var(--teal);margin-bottom:14px}
  #side .sec::before{content:"";width:8px;height:8px;background:var(--gold)}
  #side .sec::after{content:"";flex:1;height:1px;background:var(--hair)}
  #sideName{font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:30px;letter-spacing:.06em}
  #sideMeta{font-family:"Cormorant Garamond",Georgia,serif;font-size:13px;color:var(--muted);margin:6px 0 14px;font-variant-numeric:tabular-nums}
  #sideDesc{font-size:11px;line-height:1.8;color:var(--muted)}
  #sideTag{display:inline-block;margin-top:14px;font-size:10px;letter-spacing:.15em;padding:4px 10px;border:1px solid var(--hair);color:var(--ink)}
  /* SVG */
  svg{position:absolute;inset:0}
  .seg{fill:none;stroke-width:34px;cursor:pointer;transition:opacity .35s, filter .35s}
  .seg-hit{fill:none;stroke-width:54px;stroke:transparent;cursor:pointer}
  .node{cursor:pointer;transition:opacity .35s}
  .node circle{transition:transform .3s}
  .node .core{stroke:var(--bg);stroke-width:2}
  .node text{fill:var(--ink);font-size:10.5px;text-anchor:middle;pointer-events:none}
  .ring-sel{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}
  .node.sel .ring-sel{opacity:1}
  .node.lit .core{stroke:var(--gold);stroke-width:2.5}
  .dim .node:not(.keep){opacity:.16}
  .dim .seg{opacity:.25}
  .dim .seg.keep{opacity:1}
  /* 生长动画初态 */
  .pre #centerG{opacity:0;transform:scale(.6)}
  .pre .node{opacity:0}
  .pre #title,#pre #chips,#pre #hint,#pre #side{opacity:0}
  #centerG{transform-origin:430px 400px;transition:opacity .5s,transform .6s cubic-bezier(.34,1.56,.64,1)}
  .node{transition:opacity .4s}
  #title,#chips,#hint,#side{transition:opacity .6s}
</style>
</head>
<body>
<div id="stage" class="pre">
  <div id="title">
    <h1>环谱点读 · DEMO</h1>
    <div class="en">Concentric Ring Grammar — teal-solar-rings</div>
    <div class="sub">周期节点 × 分类分段 × 侧栏详情</div>
  </div>
  <div id="chips"></div>
  <svg id="svg" viewBox="0 0 1200 760"></svg>
  <div id="side">
    <div class="sec">详情</div>
    <div id="sideName">环谱</div>
    <div id="sideMeta">—</div>
    <div id="sideDesc">点击外环节点查看成员详情；点击内环分段查看分类综述；←/→ 键沿环步进。</div>
    <div id="sideTag">READY</div>
  </div>
  <div id="hint"><b>点读语法</b>：节点 → 成员详情 · 分段 → 分类综述 · chip → 同类过滤 · 高亮只给琥珀金，季色只做数据编码。</div>
</div>
<script>
const SVG = document.getElementById('svg');
const CX = 430, CY = 400, R_OUT = 250, R_SEG = 185, R_CENTER = 95;
const SHOT = new URLSearchParams(location.search).has('shot');

// demo 数据：4 类 12 节点（弧长按成员数分配）
const GROUPS = [
  {key:'spring', name:'春·木', color:'var(--spring)', n:4, desc:'分类综述占位：此段所辖 4 名成员，弧长 120°——弧长即数据。'},
  {key:'summer', name:'夏·火', color:'var(--summer)', n:2, desc:'分类综述占位：此段所辖 2 名成员，弧长 60°。'},
  {key:'autumn', name:'秋·金', color:'var(--autumn)', n:4, desc:'分类综述占位：此段所辖 4 名成员，弧长 120°。'},
  {key:'winter', name:'冬·水', color:'var(--winter)', n:2, desc:'分类综述占位：此段所辖 2 名成员，弧长 60°。'},
];
const NODES = [];
GROUPS.forEach((g,gi)=>{ for(let i=0;i<g.n;i++) NODES.push({g:gi, name:g.name+'·'+['甲','乙','丙','丁'][i]}); });

const NS = 'http://www.w3.org/2000/svg';
const el = (t,attrs)=>{ const e=document.createElementNS(NS,t); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; };
const P = (r,deg)=>{ const a=(deg-90)*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)]; };
const arc = (r,a0,a1)=>{ const [x0,y0]=P(r,a0),[x1,y1]=P(r,a1); return `M${x0},${y0} A${r},${r} 0 ${a1-a0>180?1:0} 1 ${x1},${y1}`; };

// 虚线参考环 + 中心盘
SVG.appendChild(el('circle',{cx:CX,cy:CY,r:R_OUT+34,fill:'none',stroke:'rgba(236,229,211,.26)','stroke-width':1,'stroke-dasharray':'4 8'}));
const centerG = el('g',{id:'centerG'});
centerG.appendChild(el('circle',{cx:CX,cy:CY,r:R_CENTER,fill:'#13262e',stroke:'var(--gold)','stroke-width':1}));
const ct = el('text',{x:CX,y:CY+8,'text-anchor':'middle',fill:'var(--gold)','font-size':30,'font-family':'"Noto Serif SC","Songti SC",serif','font-weight':900});
ct.textContent = '环'; centerG.appendChild(ct);
SVG.appendChild(centerG);

// 内环分段（不等弧长，段间 6° 缝）
let cursor = 0;
const segs = GROUPS.map((g,gi)=>{
  const span = g.n*30, a0 = cursor+3, a1 = cursor+span-3; cursor += span;
  const p = el('path',{d:arc(R_SEG,a0,a1),class:'seg',stroke:g.color});
  p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1; // 先占位，measure 后重设
  p.addEventListener('click',()=>selectGroup(gi));
  SVG.appendChild(p);
  const hit = el('path',{d:arc(R_SEG,a0,a1),class:'seg-hit'});
  hit.addEventListener('click',()=>selectGroup(gi));
  SVG.appendChild(hit);
  // 段名标签
  const mid=(a0+a1)/2,[lx,ly]=P(R_SEG,mid);
  const t=el('text',{x:lx,y:ly+4,'text-anchor':'middle',fill:'#0f1b21','font-size':13,'font-family':'"Noto Serif SC","Songti SC",serif','font-weight':900});
  t.textContent=g.name[0]; SVG.appendChild(t);
  return p;
});

// 外环节点（等角均布，起点正顶顺时针）
const nodeEls = NODES.map((nd,i)=>{
  const deg = i*30, [x,y]=P(R_OUT,deg), g=GROUPS[nd.g];
  const grp = el('g',{class:'node'});
  grp.appendChild(el('circle',{class:'ring-sel',cx:x,cy:y,r:22}));
  grp.appendChild(el('circle',{class:'core',cx:x,cy:y,r:15,fill:g.color}));
  const [lx,ly]=P(R_OUT+36,deg);
  const t=el('text',{x:lx,y:ly+4}); t.textContent=nd.name; grp.appendChild(t);
  grp.addEventListener('click',()=>selectNode(i));
  SVG.appendChild(grp);
  return grp;
});

// chips
const chipBox = document.getElementById('chips');
const mkChip=(label,gi,color)=>{
  const b=document.createElement('button'); b.className='chip';
  b.innerHTML=(color?`<span class="dot" style="background:${color}"></span>`:'')+label;
  b.onclick=()=>{ filter=gi; render(); }; chipBox.appendChild(b); return b;
};
const chipAll = mkChip('全部',-1);
const chipGs = GROUPS.map((g,gi)=>mkChip(g.name,gi,g.color));

// 状态与渲染
let selNode=-1, selGroup=-1, filter=-1;
const sideName=document.getElementById('sideName'), sideMeta=document.getElementById('sideMeta'),
      sideDesc=document.getElementById('sideDesc'), sideTag=document.getElementById('sideTag');
function selectNode(i){ selNode=i; selGroup=-1; render(); }
function selectGroup(gi){ selGroup=gi; selNode=-1; render(); }
function render(){
  const stage=document.getElementById('stage');
  const dim = filter>=0 || selGroup>=0 || selNode>=0;
  stage.classList.toggle('dim',dim);
  nodeEls.forEach((e,i)=>{
    const keep = filter<0 || NODES[i].g===filter;
    e.classList.toggle('keep',keep);
    e.classList.toggle('sel', i===selNode);
    e.classList.toggle('lit', selGroup>=0 && NODES[i].g===selGroup);
  });
  segs.forEach((s,gi)=>{
    s.classList.toggle('keep', selNode>=0 ? NODES[selNode].g===gi : (filter<0 || filter===gi));
    s.style.filter = (selGroup===gi || (selNode>=0&&NODES[selNode].g===gi)) ? 'brightness(1.3)' : '';
  });
  chipAll.classList.toggle('on',filter<0);
  chipGs.forEach((c,gi)=>c.classList.toggle('on',filter===gi));
  if(selNode>=0){ const nd=NODES[selNode],g=GROUPS[nd.g];
    sideName.textContent=nd.name; sideMeta.textContent=`节点 ${selNode+1} / ${NODES.length} · 属「${g.name}」段`;
    sideDesc.textContent='成员详情占位：这里放公历日期、一句物候、一句要点、2–3 枚圆形图鉴小图。'; sideTag.textContent='NODE';
  } else if(selGroup>=0){ const g=GROUPS[selGroup];
    sideName.textContent=g.name; sideMeta.textContent=`所辖 ${g.n} 节点 · 弧长 ${g.n*30}°`;
    sideDesc.textContent=g.desc; sideTag.textContent='SEGMENT';
  } else { sideName.textContent='环谱'; sideMeta.textContent='—';
    sideDesc.textContent='点击外环节点查看成员详情；点击内环分段查看分类综述；←/→ 键沿环步进。'; sideTag.textContent='READY'; }
}
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  const d = e.key==='ArrowRight'?1:-1;
  selectNode(selNode<0 ? 0 : (selNode+d+NODES.length)%NODES.length);
});

// 生长动画：中心 pop → 分段扫弧 → 节点 stagger pop → 面板淡入
function build(){
  const stage=document.getElementById('stage'); stage.classList.remove('pre');
  segs.forEach((s,i)=>{
    const len=s.getTotalLength();
    s.style.transition='none'; s.style.strokeDasharray=len; s.style.strokeDashoffset=len;
    requestAnimationFrame(()=>{ setTimeout(()=>{
      s.style.transition='stroke-dashoffset .5s ease-in-out'; s.style.strokeDashoffset=0;
    }, 400+i*150); });
  });
  nodeEls.forEach((e,i)=>{ e.style.transitionDelay=(900+i*70)+'ms'; e.style.opacity=1; });
  [['title',300],['chips',1200],['side',1400],['hint',1600]].forEach(([id,d])=>{
    const e=document.getElementById(id); e.style.transitionDelay=d+'ms'; e.style.opacity=1;
  });
}
if(SHOT || matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.getElementById('stage').classList.remove('pre');
  segs.forEach(s=>{ const l=s.getTotalLength(); s.style.strokeDasharray=l; s.style.strokeDashoffset=0; });
  nodeEls.forEach(e=>{ e.style.transition='none'; e.style.opacity=1; });
  ['title','chips','side','hint'].forEach(id=>{ const e=document.getElementById(id); e.style.transition='none'; e.style.opacity=1; });
} else { build(); }

// scale-fit
function fit(){ const s=Math.min(innerWidth/1200,innerHeight/760); document.getElementById('stage').style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();
</script>
</body>
</html>
