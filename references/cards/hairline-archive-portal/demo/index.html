<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>hairline-archive-portal · 参考卡最小 demo</title>
<style>
:root{
  --bg:#000000;
  --ink:#FFFFFF;
  --accent:#B81010;
  --rail:rgba(208,206,204,.32);
  --hairline:rgba(255,255,255,.20);
  --footnote:#3E3E3E;
  --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --gap:10px;
  --slide-ms:300ms;
  --state-ms:200ms;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--bg);overflow:hidden}
body{font-family:var(--ui);font-size:14px;color:var(--ink);line-height:1}
button{font:inherit}

.demo{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;cursor:pointer}
.track{
  display:flex;
  gap:var(--gap);
  width:max-content;
  height:100%;
  transition-property:transform;
  transition-duration:var(--slide-ms);
  will-change:transform;
}
.scene{
  position:relative;
  flex:0 0 100vw;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
}
/* 中性灰阶照片占位：演示「满幅照片 filter:none 直出」令牌——实单换成主体自带暗部的真图；
   占位不许带色相（峰值 ≤#262626），教训见卡·验证修正 1 */
.photo{position:absolute;inset:0}
.p1{background:radial-gradient(75% 85% at 68% 42%,#242424 0%,#101010 55%,#050505 100%)}
.p2{background:radial-gradient(60% 75% at 30% 62%,#1f1f1f 0%,#080808 70%)}
.p3{background:linear-gradient(115deg,#1d1d1d 0%,#090909 62%)}
.p4{background:radial-gradient(52% 62% at 74% 30%,#262626 0%,#0a0a0a 78%)}
.ghost{
  position:absolute;
  top:50%;
  left:100px;
  width:100%;
  margin-top:-230px;
  transform:translateY(-50%);
  color:var(--ink);
  opacity:.03;
  font-family:"Playfair Display";
  font-size:42vh;
  font-weight:900;
  line-height:300px;
  white-space:nowrap;
  pointer-events:none;
}
.ghost span{display:block}
.copy{
  position:absolute;
  top:50%;
  right:10px;
  width:calc(50% - 10px);
  transform:translateY(-50%);
  text-align:left;
  color:var(--ink);
  pointer-events:none;
}
.title{
  margin:0;
  font-family:var(--ui);
  font-size:100px;
  font-weight:300;
  line-height:100px;
}
.subtitle{
  margin:0;
  padding-left:50px;
  font-family:var(--ui);
  font-size:80px;
  font-weight:100;
  line-height:80px;
  letter-spacing:5px;
  white-space:nowrap;
}
.scene:not(.is-active) .title,
.scene:not(.is-active) .subtitle{
  opacity:0;
  animation:none;
}
.scene.is-active .title,
.scene.is-active .subtitle{
  animation:fadeIn 1s ease-out .6s 1 both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.vertical-mark{
  position:absolute;
  z-index:4;
  top:calc((50% - (80vh / 2)) + (5vh / 2));
  left:calc(13vw - 3rem);
  color:var(--ink);
  font-size:20px;
  font-weight:300;
  letter-spacing:.2em;
  writing-mode:vertical-rl;
  pointer-events:none;
}
.vertical-mark span{
  font-size:16px;
  font-weight:400;
  letter-spacing:2px;
  text-transform:uppercase;
}
.vertical-mark::after{
  content:"";
  display:block;
  position:absolute;
  top:calc(100% + 5px);
  left:45%;
  width:1px;
  height:40px;
  transform:translateX(-50%);
  background:var(--ink);
}

.rail{
  position:absolute;
  z-index:5;
  right:0;
  bottom:50px;
  width:75%;
  height:127px;
  padding-top:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.rail-button{
  position:relative;
  height:90px;
  margin:10px 0 0;
  padding:0;
  border:0;
  border-left:1px solid var(--hairline);
  color:var(--ink);
  background:var(--rail);
  cursor:pointer;
  transition:all var(--state-ms) ease-in-out;
}
.rail-button:first-child{border-left:0}
.rail-button:hover{color:var(--bg);background:var(--ink)}
.rail-button.is-active,
.rail-button.is-active:hover{
  margin-top:5px;
  padding:5px 0;
  color:var(--ink);
  background:var(--accent);
}
.rail-title{display:block;font-size:22px;font-weight:400;line-height:20px}
.rail-subtitle{
  display:block;
  margin-top:8px;
  font-size:12px;
  font-weight:320;
  line-height:12px;
  text-transform:uppercase;
}
.footer{
  position:absolute;
  z-index:3;
  right:0;
  bottom:0;
  left:0;
  height:65px;
  padding-right:20px;
  color:var(--footnote);
  background:var(--bg);
  font-size:.9rem;
  line-height:65px;
  text-align:right;
  pointer-events:none;
}

@media (max-width:840px){
  .vertical-mark{top:30px;left:30px;font-size:14px;letter-spacing:.1em}
  .vertical-mark span{font-size:12px;letter-spacing:2px}
  .copy{top:auto;right:50px;bottom:170px;width:auto;transform:none}
  .title{font-size:40px;line-height:40px}
  .subtitle{margin-top:20px;padding-left:50px;font-size:20px;font-weight:100;line-height:20px;letter-spacing:5px}
  .rail{
    top:100px;
    right:0;
    bottom:auto;
    width:220px;
    height:auto;
    padding-top:0;
    display:block;
  }
  .rail-button{
    display:block;
    width:200px;
    height:auto;
    margin:1px 0 0;
    padding:10px 5px;
    transform:translateX(50px);
  }
  .rail-button.is-active,
  .rail-button.is-active:hover{
    margin-top:1px;
    padding:10px 5px;
    transform:translateX(10px);
  }
  .rail-title{font-size:14px;line-height:20px}
  .rail-subtitle{font-size:12px;font-weight:100;line-height:12px}
  .footer{height:35px;padding:10px 20px;font-size:10px;line-height:18px}
  .ghost{left:30px}
}
</style>
</head>
<body>
<main class="demo">
  <div class="viewport" id="viewport" aria-label="联动索引切换演示">
    <div class="track" id="track">
      <section class="scene is-active" aria-hidden="false">
        <div class="photo p1"></div>
        <div class="ghost"><span>INDEX</span><span>01</span></div>
        <div class="copy"><p class="title">[标题 01]</p><p class="subtitle">TYPE / 01</p></div>
      </section>
      <section class="scene" aria-hidden="true">
        <div class="photo p2"></div>
        <div class="ghost"><span>INDEX</span><span>02</span></div>
        <div class="copy"><p class="title">[标题 02]</p><p class="subtitle">TYPE / 02</p></div>
      </section>
      <section class="scene" aria-hidden="true">
        <div class="photo p3"></div>
        <div class="ghost"><span>INDEX</span><span>03</span></div>
        <div class="copy"><p class="title">[标题 03]</p><p class="subtitle">TYPE / 03</p></div>
      </section>
      <section class="scene" aria-hidden="true">
        <div class="photo p4"></div>
        <div class="ghost"><span>INDEX</span><span>04</span></div>
        <div class="copy"><p class="title">[标题 04]</p><p class="subtitle">TYPE / 04</p></div>
      </section>
    </div>
  </div>

  <div class="vertical-mark"><span>TYPE</span>&nbsp;<span>INDEX</span></div>

  <nav class="rail" aria-label="四段联动索引">
    <button class="rail-button is-active" type="button" data-index="0" aria-current="true"><span class="rail-title">索引 01</span><span class="rail-subtitle">INDEX / 01</span></button>
    <button class="rail-button" type="button" data-index="1"><span class="rail-title">索引 02</span><span class="rail-subtitle">INDEX / 02</span></button>
    <button class="rail-button" type="button" data-index="2"><span class="rail-title">索引 03</span><span class="rail-subtitle">INDEX / 03</span></button>
    <button class="rail-button" type="button" data-index="3"><span class="rail-title">索引 04</span><span class="rail-subtitle">INDEX / 04</span></button>
  </nav>

  <div class="footer">EVIDENCE DEMO / 01 — 04</div>
</main>

<script>
(() => {
  const count = 4;
  const gap = 10;
  const threshold = 5;
  const touchRatio = 1;
  const resistanceRatio = 0.85;
  const track = document.getElementById('track');
  const viewport = document.getElementById('viewport');
  const buttons = [...document.querySelectorAll('.rail-button')];
  const originals = [...track.querySelectorAll('.scene')];
  const before = originals[count - 1].cloneNode(true);
  const after = originals[0].cloneNode(true);
  before.dataset.clone = 'before';
  after.dataset.clone = 'after';
  before.setAttribute('aria-hidden', 'true');
  after.setAttribute('aria-hidden', 'true');
  track.insertBefore(before, originals[0]);
  track.appendChild(after);
  const scenes = [...track.querySelectorAll('.scene')];
  let index = 0;
  let physical = 1;
  let startX = null;
  let deltaX = 0;

  const offsetFor = slot => -slot * (window.innerWidth + gap);

  const placeTrack = (animate = true) => {
    track.style.transitionDuration = animate ? '300ms' : '0ms';
    track.style.transform = `translate3d(${offsetFor(physical)}px,0,0)`;
  };

  const paintState = () => {
    scenes.forEach((scene, slot) => {
      const active = slot === physical;
      scene.classList.toggle('is-active', active);
      scene.setAttribute('aria-hidden', String(!active));
    });
    buttons.forEach((button, i) => {
      const active = i === index;
      button.classList.toggle('is-active', active);
      if (active) button.setAttribute('aria-current', 'true');
      else button.removeAttribute('aria-current');
    });
  };

  const activate = (next, animate = true) => {
    const normalized = (next + count) % count;
    if (index === count - 1 && normalized === 0) physical = count + 1;
    else if (index === 0 && normalized === count - 1) physical = 0;
    else physical = normalized + 1;
    index = normalized;
    paintState();
    placeTrack(animate);
  };

  buttons.forEach(button => {
    button.addEventListener('click', () => activate(Number(button.dataset.index)));
  });

  viewport.addEventListener('pointerdown', event => {
    startX = event.clientX;
    deltaX = 0;
    track.style.transitionDuration = '0ms';
    viewport.setPointerCapture(event.pointerId);
  });

  viewport.addEventListener('pointermove', event => {
    if (startX === null) return;
    deltaX = (event.clientX - startX) * touchRatio;
    const beyondStart = physical === 0 && deltaX > 0;
    const beyondEnd = physical === count + 1 && deltaX < 0;
    const resisted = beyondStart || beyondEnd ? deltaX * resistanceRatio : deltaX;
    track.style.transform = `translate3d(${offsetFor(physical) + resisted}px,0,0)`;
  });

  viewport.addEventListener('pointerup', event => {
    if (startX === null) return;
    deltaX = (event.clientX - startX) * touchRatio;
    startX = null;
    if (Math.abs(deltaX) <= threshold) placeTrack(true);
    else activate(index + (deltaX < 0 ? 1 : -1));
  });

  viewport.addEventListener('pointercancel', () => {
    startX = null;
    placeTrack(true);
  });

  track.addEventListener('transitionend', event => {
    if (event.propertyName !== 'transform') return;
    if (physical === 0) physical = count;
    else if (physical === count + 1) physical = 1;
    else return;
    paintState();
    placeTrack(false);
  });

  window.addEventListener('resize', () => placeTrack(false));
  paintState();
  placeTrack(false);
})();
</script>
</body>
</html>
