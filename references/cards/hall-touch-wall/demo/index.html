<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hall-touch-wall · 签名交互 demo</title>
<style>
  :root{
    --bg:#070B12; --ink:#F5EFE3; --gold:#E3B34E; --aura:rgba(227,179,78,.35);
    --jade:#5FA8A0; --red:#C05850; --amber:#D19A3F; --blue:#6E93C4;
    --muted:rgba(245,239,227,.62); --hair:rgba(245,239,227,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden; cursor:none;
    font-family:"Noto Sans SC","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{width:3840px;height:2160px;position:relative;flex:none;transform-origin:center;background:var(--bg);overflow:hidden}
  #gl{position:absolute;inset:0;width:100%;height:100%}
  #svg{position:absolute;inset:0;width:100%;height:100%}
  /* 细网格层 */
  #grid{position:absolute;inset:0;opacity:.05;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 160px),
      repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 160px);}
  /* 雷达扫描光束 */
  #sweep{position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg at 50% 53%, transparent 0deg 332deg, rgba(227,179,78,.09) 352deg, transparent 360deg);
    animation:sweep 26s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .shot #sweep{animation-play-state:paused;animation-delay:-9s}
  .shot .spin{animation-play-state:paused}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 34s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* HUD 角标 */
  .hud{position:absolute;font-family:"JetBrains Mono","SF Mono",monospace;font-size:28px;
    letter-spacing:.18em;color:var(--muted);z-index:3;white-space:nowrap}
  .hud.tl{left:72px;top:56px}.hud.tr{right:72px;top:56px}
  .hud.bl{left:72px;bottom:48px}.hud.br{right:72px;bottom:48px}
  /* 角框 */
  .br{position:absolute;width:120px;height:120px;z-index:2;pointer-events:none;opacity:.5}
  .br.tl{left:48px;top:40px;border-left:3px solid var(--hair);border-top:3px solid var(--hair)}
  .br.tr{right:48px;top:40px;border-right:3px solid var(--hair);border-top:3px solid var(--hair)}
  .br.bl{left:48px;bottom:40px;border-left:3px solid var(--hair);border-bottom:3px solid var(--hair)}
  .br.br2{right:48px;bottom:40px;border-right:3px solid var(--hair);border-bottom:3px solid var(--hair)}
  /* 标题 */
  #title{position:absolute;left:0;right:0;top:520px;text-align:center;z-index:2;pointer-events:none}
  #title .eyebrow{font-family:"JetBrains Mono",monospace;font-size:30px;letter-spacing:.5em;
    color:var(--gold);margin-bottom:44px}
  #title h1{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:900;
    font-size:150px;letter-spacing:.12em;color:var(--ink)}
  #title .sub{margin-top:36px;font-size:44px;letter-spacing:.5em;color:var(--muted)}
  /* 节点 */
  .node .sel{fill:none;stroke:var(--gold);stroke-width:4;opacity:0}
  .node .sel2{fill:none;stroke:var(--gold);stroke-width:2;opacity:0;stroke-dasharray:6 10}
  .node.on .sel,.node.on .sel2{opacity:1}
  .node .ring{fill:none;stroke-width:2;stroke-dasharray:4 14;opacity:.55}
  .node text{font-family:"JetBrains Mono",monospace;font-size:28px;fill:var(--muted);text-anchor:middle;letter-spacing:.12em}
  .link{stroke:var(--ink);stroke-width:2;opacity:.07}
  .ripple{fill:none;stroke:var(--gold);stroke-width:5;pointer-events:none}
  /* 玻璃面板 */
  #panel{position:absolute;left:480px;right:480px;bottom:400px;z-index:3;
    background:rgba(9,14,24,.58);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--hair);padding:56px 72px 60px;opacity:0;transition:opacity .5s}
  #panel.show{opacity:1}
  #panel::before,#panel::after{content:"";position:absolute;width:36px;height:36px;border-color:var(--gold);border-style:solid}
  #panel::before{left:-2px;top:-2px;border-width:3px 0 0 3px}
  #panel::after{right:-2px;bottom:-2px;border-width:0 3px 3px 0}
  #pMeta{font-family:"JetBrains Mono",monospace;font-size:28px;letter-spacing:.2em;color:var(--gold);margin-bottom:26px}
  #pName{font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:96px;letter-spacing:.08em;line-height:1.1}
  #pDesc{margin-top:26px;font-size:38px;line-height:1.8;color:var(--muted)}
  /* 操作带 */
  #dock{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;gap:48px;z-index:3}
  .dbtn{width:480px;height:120px;border-radius:60px;border:2px solid var(--hair);
    display:flex;align-items:center;justify-content:center;font-size:40px;letter-spacing:.24em;color:var(--ink)}
  .dbtn.on{border-color:var(--gold);color:var(--gold)}
  .pre #title,.pre #panel,.pre #dock,.pre .hud,.pre .br{opacity:0}
  #title,#dock,.hud,.br{transition:opacity .8s}
</style>
</head>
<body>
<div id="stage" class="pre">
  <canvas id="gl"></canvas>
  <div id="grid"></div>
  <div id="sweep"></div>
  <svg id="svg" viewBox="0 0 3840 2160">
    <defs>
      <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="16" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
  <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br2"></div>
  <div id="title">
    <div class="eyebrow">EXHIBITION FIELD · TOUCH TO EXPLORE</div>
    <h1>巨幕 · 待机生息</h1>
    <div class="sub">触 摸 任 意 光 点</div>
  </div>
  <div id="panel">
    <div id="pMeta"></div>
    <div id="pName"></div>
    <div id="pDesc"></div>
  </div>
  <div id="dock">
    <div class="dbtn on">总 览</div>
    <div class="dbtn">分 类 导 览</div>
    <div class="dbtn">关 于</div>
  </div>
  <div class="hud tl">HALL·TOUCH·WALL</div>
  <div class="hud tr" id="clock">--:--:--</div>
  <div class="hud bl">3840 × 2160 · WEBGL2 NEBULA FIELD</div>
  <div class="hud br">14 OBJECTS · IDLE ⟳ 30S</div>
</div>
<script>
'use strict';
const SHOT=new URLSearchParams(location.search).has('shot');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(SHOT) document.getElementById('stage').classList.add('shot');

/* ══ 01 WebGL2 体积星云底（语法移植自内部深空星图 demo，金色调至展厅金 #E3B34E，镜头改自主漫游） ══ */
(function(){
  const canvas=document.getElementById('gl');
  const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});
  if(!gl) return;
  const VERT=`#version 300 es
void main(){vec2 v=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(v*2.0-1.0,0.0,1.0);}`;
  const FRAG=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse;
out vec4 fragColor;
#define OCT 5
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float a=hash21(i),b=hash21(i+vec2(1.0,0.0)),c=hash21(i+vec2(0.0,1.0)),d=hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;mat2 rot=mat2(0.8,-0.6,0.6,0.8);
  for(int i=0;i<OCT;i++){v+=a*vnoise(p);p=rot*p*2.03+vec2(11.5,7.5);a*=0.5;}return v;}
vec3 starLayer(vec2 suv,float scale,float thr,float t){
  vec2 id=floor(suv*scale); vec2 gv=fract(suv*scale)-0.5;
  float h=hash21(mod(id,289.0));
  vec2 offs=(vec2(hash21(mod(id+7.13,289.0)),hash21(mod(id+3.71,289.0)))-0.5)*0.7;
  float d=length(gv-offs);
  float core=smoothstep(0.09,0.0,d);
  float glow=exp(-d*16.0)*0.4;
  float tw=0.55+0.45*sin(t*(1.2+3.5*fract(h*91.7))+h*6.2831);
  return vec3(0.92,0.95,1.0)*(core+glow)*step(thr,h)*tw;}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  vec2 m=uMouse;
  vec2 drift=vec2(0.006,0.0032)*uTime;
  vec2 p=uv*1.7+drift+m*0.06;
  vec2 q=vec2(fbm(p),fbm(p+vec2(5.2,1.3)));
  vec2 r=vec2(fbm(p+2.2*q+vec2(1.7,9.2)),fbm(p+2.2*q+vec2(8.3,2.8)));
  float f=fbm(p+2.6*r);
  vec3 col=vec3(0.027,0.043,0.071);                                   // 展厅墨蓝 #070B12
  col=mix(col,vec3(0.078,0.114,0.224),smoothstep(0.18,0.62,f));
  col=mix(col,vec3(0.110,0.290,0.250),smoothstep(0.42,0.85,q.x)*0.55);
  col=mix(col,vec3(0.890,0.702,0.306),smoothstep(0.58,0.95,r.y*f)*0.50); // 展厅金 #E3B34E
  float warm=smoothstep(0.60,0.92,fbm(p*1.9+vec2(4.7,2.3)+r*0.9));
  float cool=smoothstep(0.62,0.95,fbm(p*1.9+vec2(9.4,6.1)+q*0.9));
  col+=vec3(0.89,0.66,0.35)*warm*warm*1.15;
  col+=vec3(0.43,0.58,0.77)*cool*cool*0.95;                            // 黛蓝星簇
  const float SC[3]=float[3](42.0,60.0,90.0);
  const float TH[3]=float[3](0.978,0.986,0.991);
  const float PF[3]=float[3](0.105,0.065,0.032);
  for(int i=0;i<3;i++){
    vec2 sp=uv+drift*(0.30+0.18*float(i))+m*PF[i];
    col+=starLayer(sp,SC[i],TH[i],uTime)*(0.85-0.18*float(i));
  }
  col=pow(max(col,0.0)*1.55,vec3(0.88));
  col*=mix(0.72,1.0,smoothstep(1.25,0.30,length(uv)));
  col+=(hash21(gl_FragCoord.xy+fract(uTime)*113.0)-0.5)*0.026;
  fragColor=vec4(col,1.0);
}`;
  function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    return gl.getShaderParameter(sh,gl.COMPILE_STATUS)?sh:null;}
  const vs=compile(gl.VERTEX_SHADER,VERT),fs=compile(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return;
  const prog=gl.createProgram();
  gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return;
  gl.useProgram(prog);
  const uRes=gl.getUniformLocation(prog,'uRes'),uTime=gl.getUniformLocation(prog,'uTime'),
        uMouse=gl.getUniformLocation(prog,'uMouse');
  function resize(){const dpr=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(3840*dpr);canvas.height=Math.round(2160*dpr);
    gl.viewport(0,0,canvas.width,canvas.height);}
  addEventListener('resize',resize);resize();
  let frames=0;
  function draw(t){
    /* 自主漫游镜头（无鼠标的大屏：sin/cos 慢速游走） */
    const mx=Math.sin(t*0.11)*0.30, my=Math.cos(t*0.083)*0.24;
    gl.uniform2f(uRes,canvas.width,canvas.height);
    gl.uniform1f(uTime,t);
    gl.uniform2f(uMouse,mx,my);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  if(SHOT||RM){ draw(14.0); }                       /* 定格一帧有氛围的画面 */
  else{ const t0=performance.now();
    (function loop(now){ draw((now-t0)/1000); requestAnimationFrame(loop); })(t0); }
})();

/* ══ 02 节点场 ══ */
const SVG=document.getElementById('svg'), NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const CATS=[{n:'青玉',c:'var(--jade)',hex:'#5FA8A0'},{n:'赭红',c:'var(--red)',hex:'#C05850'},
            {n:'藤黄',c:'var(--amber)',hex:'#D19A3F'},{n:'黛蓝',c:'var(--blue)',hex:'#6E93C4'}];
const NODES=[];
for(let i=0;i<14;i++){
  const col=i%4, ang=(i/14)*Math.PI*2, r=560+((i*173)%320);
  NODES.push({
    x:1920+Math.cos(ang)*r*1.35, y:1150+Math.sin(ang)*r*.62,
    amp:26+((i*37)%34), sp:.00022+((i*13)%7)*.00004, ph:i*1.7,
    cat:col, id:'N-'+String(i+1).padStart(2,'0'),
    name:CATS[col].n+' · 展项 '+(i+1),
    desc:'指尖直达的大字详情面板：展品一句话故事写在这里，38px 起步，三米外可读。零 hover 依赖，点中即常驻。'
  });
}
/* 细连线（每点连最近邻，opacity .07） */
NODES.forEach((a,i)=>{
  let best=-1,bd=1e12;
  NODES.forEach((b,j)=>{ if(i===j)return; const d=(a.x-b.x)**2+(a.y-b.y)**2; if(d<bd){bd=d;best=j;} });
  if(best>i) SVG.appendChild(el('line',{class:'link',x1:a.x,y1:a.y,x2:NODES[best].x,y2:NODES[best].y}));
});
/* 节点：核心辉光 + 刻度环 + mono 编号 */
const nodeEls=NODES.map((nd,i)=>{
  const g=el('g',{class:'node'});
  g.appendChild(el('circle',{class:'sel',r:56}));
  g.appendChild(el('circle',{class:'sel2 spin',r:70}));
  g.appendChild(el('circle',{class:'ring spin',r:44,stroke:CATS[nd.cat].hex}));
  g.appendChild(el('circle',{r:88,fill:'transparent'}));                    /* ≥88px@4K 触摸目标 */
  g.appendChild(el('circle',{class:'core',r:24,fill:CATS[nd.cat].hex,filter:'url(#glow)'}));
  const t=el('text',{y:108}); t.textContent=nd.id; g.appendChild(t);
  g.addEventListener('click',e=>{e.stopPropagation();select(i);});
  SVG.appendChild(g); return g;
});
function place(i,x,y){
  const g=nodeEls[i];
  for(const c of g.children){ if(c.tagName==='text'){c.setAttribute('x',x);c.setAttribute('y',y+108);} else {c.setAttribute('cx',x);c.setAttribute('cy',y);} }
}
/* 面板 */
const panel=document.getElementById('panel'),pMeta=document.getElementById('pMeta'),
      pName=document.getElementById('pName'),pDesc=document.getElementById('pDesc');
let sel=-1, idleTimer=null;
function select(i){
  sel=i; nodeEls.forEach((g,j)=>g.classList.toggle('on',j===i));
  const nd=NODES[i];
  pMeta.textContent=`ID ${nd.id} · CAT ${CATS[nd.cat].n} · POS ${Math.round(nd.x)},${Math.round(nd.y)}`;
  pName.innerHTML=`<span style="display:inline-block;width:40px;height:40px;border-radius:50%;background:${CATS[nd.cat].hex};margin-right:36px;vertical-align:14px"></span>${nd.name}`;
  pDesc.textContent=nd.desc; panel.classList.add('show'); poke();
}
/* 涟漪 */
SVG.addEventListener('click',e=>{
  const pt=SVG.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(SVG.getScreenCTM().inverse());
  const r=el('circle',{class:'ripple',cx:p.x,cy:p.y,r:20,opacity:.5});
  SVG.appendChild(r);
  const t0=performance.now();
  (function anim(t){const k=(t-t0)/700;
    if(k>=1){r.remove();return;}
    r.setAttribute('r',20+k*180); r.setAttribute('opacity',.5*(1-k));
    requestAnimationFrame(anim);})(t0);
  poke();
});
/* 待机回退 */
function poke(){clearTimeout(idleTimer); idleTimer=setTimeout(()=>{panel.classList.remove('show'); sel=-1; nodeEls.forEach(g=>g.classList.remove('on'));},30000);}
/* 漂移 */
let running=!SHOT&&!RM;
function drift(t){ NODES.forEach((nd,i)=>{
    place(i, nd.x+Math.sin(t*nd.sp+nd.ph)*nd.amp, nd.y+Math.cos(t*nd.sp*1.3+nd.ph)*nd.amp*.8);
  }); if(running) requestAnimationFrame(drift); }
if(running) requestAnimationFrame(drift);
else NODES.forEach((nd,i)=>place(i,nd.x,nd.y));
/* 时钟 HUD */
const clock=document.getElementById('clock');
function tick(){ if(SHOT){clock.textContent='IDLE ⟳ 12:00:00';return;}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  clock.textContent=`IDLE ⟳ ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  setTimeout(tick,1000); }
tick();
/* 入场 + scale-fit */
requestAnimationFrame(()=>{ document.getElementById('stage').classList.remove('pre');
  if(SHOT) select(2); });
function fit(){const s=Math.min(innerWidth/3840,innerHeight/2160);document.getElementById('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit); fit();
</script>
</body>
</html>
