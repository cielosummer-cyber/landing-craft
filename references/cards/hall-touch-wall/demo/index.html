<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hall-touch-wall · 签名交互 demo</title>
<style>
  :root{
    --bg:#070B12; --ink:#F5EFE3; --gold:#E3B34E; --aura:rgba(227,179,78,.35);
    --jade:#5FA8A0; --red:#C05850; --amber:#D19A3F; --blue:#6E93C4;
    --muted:rgba(245,239,227,.62); --hair:rgba(245,239,227,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden; cursor:none;
    font-family:"Noto Sans SC","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{width:3840px;height:2160px;position:relative;flex:none;transform-origin:center;
    background:radial-gradient(2000px 1400px at 50% 44%, #0B1220 0%, var(--bg) 75%)}
  svg{position:absolute;inset:0}
  .hud{position:absolute;font-family:"JetBrains Mono","SF Mono",monospace;font-size:28px;
    letter-spacing:.18em;color:var(--muted);z-index:2}
  .hud.tl{left:72px;top:56px}.hud.tr{right:72px;top:56px}
  .hud.bl{left:72px;bottom:48px}.hud.br{right:72px;bottom:48px}
  #title{position:absolute;left:0;right:0;top:560px;text-align:center;z-index:1;pointer-events:none}
  #title h1{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:900;
    font-size:150px;letter-spacing:.12em;color:var(--ink)}
  #title .sub{margin-top:36px;font-size:44px;letter-spacing:.5em;color:var(--muted)}
  .node{cursor:none}
  .node .sel{fill:none;stroke:var(--gold);stroke-width:4;opacity:0}
  .node.on .sel{opacity:1}
  .ripple{fill:none;stroke:var(--gold);stroke-width:5;pointer-events:none}
  #panel{position:absolute;left:480px;right:480px;bottom:400px;z-index:2;
    border-top:2px solid var(--hair);padding-top:48px;opacity:0;transition:opacity .5s}
  #panel.show{opacity:1}
  #pName{font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:96px;letter-spacing:.08em}
  #pName .dot{display:inline-block;width:40px;height:40px;border-radius:50%;margin-right:36px;vertical-align:14px}
  #pDesc{margin-top:28px;font-size:38px;line-height:1.8;color:var(--muted)}
  #dock{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;gap:48px;z-index:2}
  .dbtn{width:480px;height:120px;border-radius:60px;border:2px solid var(--hair);
    display:flex;align-items:center;justify-content:center;font-size:40px;letter-spacing:.24em;color:var(--ink)}
  .dbtn.on{border-color:var(--gold);color:var(--gold)}
  .pre #title,.pre #panel,.pre #dock,.pre .hud{opacity:0}
  #title,#dock,.hud{transition:opacity .8s}
</style>
</head>
<body>
<div id="stage" class="pre">
  <svg id="svg" viewBox="0 0 3840 2160">
    <defs>
      <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="16" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
  <div id="title">
    <h1>巨幕 · 待机生息</h1>
    <div class="sub">触 摸 任 意 光 点</div>
  </div>
  <div id="panel">
    <div id="pName"></div>
    <div id="pDesc"></div>
  </div>
  <div id="dock">
    <div class="dbtn on">总 览</div>
    <div class="dbtn">分 类 导 览</div>
    <div class="dbtn">关 于</div>
  </div>
  <div class="hud tl">HALL·TOUCH·WALL</div>
  <div class="hud tr">IDLE ⟳ 30S</div>
  <div class="hud bl">3840 × 2160</div>
  <div class="hud br">DEMO · ?shot=1</div>
</div>
<script>
const SVG=document.getElementById('svg'), NS='http://www.w3.org/2000/svg';
const SHOT=new URLSearchParams(location.search).has('shot');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const CATS=[{n:'青玉',c:'var(--jade)'},{n:'赭红',c:'var(--red)'},{n:'藤黄',c:'var(--amber)'},{n:'黛蓝',c:'var(--blue)'}];
const NODES=[];
for(let i=0;i<14;i++){
  const col=i%4, ang=(i/14)*Math.PI*2, r=560+((i*173)%320);
  NODES.push({
    x:1920+Math.cos(ang)*r*1.35, y:1150+Math.sin(ang)*r*.62,
    amp:26+((i*37)%34), sp:.00022+((i*13)%7)*.00004, ph:i*1.7,
    cat:col, name:CATS[col].n+' · 展项 '+(i+1),
    desc:'指尖直达的大字详情面板：展品一句话故事写在这里，38px 起步，三米外可读。零 hover 依赖，点中即常驻。'
  });
}
/* 远景微光粒子（静态） */
for(let i=0;i<90;i++){
  SVG.appendChild(el('circle',{cx:(i*797)%3840, cy:(i*431)%2160, r:(i%3)+1.5,
    fill:'#F5EFE3', opacity:.05+(i%5)*.02}));
}
/* 节点 */
const nodeEls=NODES.map((nd,i)=>{
  const g=el('g',{class:'node'});
  g.appendChild(el('circle',{class:'sel',r:52}));
  const hit=el('circle',{r:88,fill:'transparent'});   /* ≥88px@4K 触摸目标 */
  const core=el('circle',{r:26,fill:CATS[nd.cat].c,filter:'url(#glow)'});
  g.append(hit,core);
  g.addEventListener('click',e=>{e.stopPropagation();select(i);});
  SVG.appendChild(g); return g;
});
function place(i,x,y){const g=nodeEls[i];for(const c of g.children){c.setAttribute('cx',x);c.setAttribute('cy',y);}}
/* 面板 */
const panel=document.getElementById('panel'),pName=document.getElementById('pName'),pDesc=document.getElementById('pDesc');
let sel=-1, idleTimer=null;
function select(i){
  sel=i; nodeEls.forEach((g,j)=>g.classList.toggle('on',j===i));
  const nd=NODES[i];
  pName.innerHTML=`<span class="dot" style="background:${CATS[nd.cat].c}"></span>${nd.name}`;
  pDesc.textContent=nd.desc; panel.classList.add('show'); poke();
}
/* 涟漪 */
SVG.addEventListener('click',e=>{
  const pt=SVG.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const m=SVG.getScreenCTM().inverse(), p=pt.matrixTransform(m);
  const r=el('circle',{class:'ripple',cx:p.x,cy:p.y,r:20,opacity:.5});
  SVG.appendChild(r);
  const t0=performance.now();
  (function anim(t){const k=(t-t0)/700;
    if(k>=1){r.remove();return;}
    r.setAttribute('r',20+k*180); r.setAttribute('opacity',.5*(1-k));
    requestAnimationFrame(anim);})(t0);
  poke();
});
/* 待机回退：30s 无操作合面板 */
function poke(){clearTimeout(idleTimer); idleTimer=setTimeout(()=>{panel.classList.remove('show'); sel=-1; nodeEls.forEach(g=>g.classList.remove('on'));},30000);}
/* 待机漂移 */
let running=!SHOT&&!RM;
function drift(t){ NODES.forEach((nd,i)=>{
    place(i, nd.x+Math.sin(t*nd.sp+nd.ph)*nd.amp, nd.y+Math.cos(t*nd.sp*1.3+nd.ph)*nd.amp*.8);
  }); if(running) requestAnimationFrame(drift); }
if(running) requestAnimationFrame(drift);
else NODES.forEach((nd,i)=>place(i,nd.x,nd.y));
/* 入场 */
requestAnimationFrame(()=>{ document.getElementById('stage').classList.remove('pre');
  if(SHOT) select(2); });
/* scale-fit */
function fit(){const s=Math.min(innerWidth/3840,innerHeight/2160);document.getElementById('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit); fit();
</script>
</body>
</html>
